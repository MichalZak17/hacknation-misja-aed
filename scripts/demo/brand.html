<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Otwarte AED</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; }
  body { background: radial-gradient(circle at 60% 40%, #16303a 0%, #0b1f28 70%); font-family: "Space Grotesk", sans-serif; color: #fff; }
  .stage { position: absolute; inset: 0; transition: opacity .8s; }
  .hide { opacity: 0; pointer-events: none; }
  /* 1: "<3" turns into the mark */
  #lt { position: absolute; left: 50%; top: 50%; font-size: 380px; font-weight: 700; line-height: 1; letter-spacing: -10px;
        transform: translate(-50%, -54%) rotate(0deg); transition: transform 1.6s cubic-bezier(.6,0,.2,1), opacity .8s; }
  #lt.turn { transform: translate(-50%, -50%) rotate(-90deg) scale(.86); }
  #lt.fade { opacity: 0; }
  #mark { position: absolute; left: 50%; top: 50%; width: 420px; transform: translate(-50%, -50%) scale(.9); opacity: 0;
          transition: opacity .9s, transform 1.2s cubic-bezier(.6,0,.2,1); }
  #mark.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #mark.left { transform: translate(-50%, -50%) translateX(-560px) scale(.62); opacity: 0; }
  #word { position: absolute; left: 50%; top: 42%; width: 1100px; transform: translate(-50%, -50%); opacity: 0; transition: opacity 1s, top 1s; }
  #word.on { opacity: 1; }
  #word.up { top: 34%; }
  #slogan { position: absolute; left: 0; right: 0; top: 56%; text-align: center; font-size: 66px; font-weight: 500; opacity: 0; transition: opacity 1s; }
  #slogan b { color: #e6013a; font-weight: 500; }
  #slogan.on { opacity: 1; }
  #tag { position: absolute; left: 0; right: 0; top: 68%; text-align: center; font-family: "JetBrains Mono", monospace; font-size: 30px; color: #9fb7bf; opacity: 0; transition: opacity 1s; }
  #tag.on { opacity: 1; }
  #note { position: absolute; left: 0; right: 0; top: 78%; text-align: center; font-size: 30px; color: #b9ccd2; opacity: 0; transition: opacity 1s; }
  #note.on { opacity: 1; }
  /* 2: brand book pages */
  #pages { display: flex; gap: 46px; justify-content: center; align-items: center; height: 100%; }
  #pages img { height: 900px; box-shadow: 0 30px 80px rgba(0,0,0,.55); transition: transform 7s linear, opacity .8s; }
  #pages.zoom img { transform: scale(1.06); }
  #zoom { position: absolute; inset: 0; overflow: hidden; }
  #zoom img { position: absolute; width: 1920px; left: 0; top: 0; transform-origin: 0 0; transition: transform 3s cubic-bezier(.4,0,.2,1); }
</style>
</head>
<body>
  <div class="stage" id="s1">
    <div id="lt">&lt;3</div>
    <img id="mark" src="../../marketing/logo/otwarte-aed-znak-kolor-ciemne-tlo.svg" alt="">
    <img id="word" src="../../marketing/logo/otwarte-aed-poziomy-kolor-ciemne-tlo.svg" alt="">
    <div id="slogan">Pokaż <b>AED</b>, zanim ktoś będzie go szukał.</div>
    <div id="tag">#OtwarteAED</div>
    <div id="note">Kampania dla dysponentów: gmin, szkół, firm, szpitali, straży</div>
  </div>
  <div class="stage hide" id="s2"><div id="pages"></div></div>
  <div class="stage hide" id="s3"><div id="zoom"><img id="zimg" alt=""></div></div>
<script>
  const $ = (id) => document.getElementById(id);
  const P = (n) => `out/brand/p${String(n).padStart(2, "0")}.png`;
  const show = (id) => { for (const s of ["s1", "s2", "s3"]) $(s).classList.toggle("hide", s !== id); };
  const pages = (list) => {
    const box = $("pages");
    box.classList.remove("zoom");
    box.innerHTML = list.map((n) => `<img src="${P(n)}" alt="">`).join("");
    requestAnimationFrame(() => requestAnimationFrame(() => box.classList.add("zoom")));
    show("s2");
  };
  // zoom into a region of one page: x, y, w in page fractions
  const zoom = (n, from, to) => {
    const img = $("zimg");
    const apply = ([x, y, w]) => {
      const s = 1920 / (w * 1920);
      img.style.transform = `scale(${s}) translate(${-x * 1920}px, ${-y * 1920 * 1.4142}px)`;
    };
    img.style.transition = "none";
    img.src = P(n);
    apply(from);
    show("s3");
    requestAnimationFrame(() => requestAnimationFrame(() => { img.style.transition = ""; apply(to); }));
  };
  window.step = (n) => {
    if (n === 1) { $("lt").classList.add("turn"); }
    if (n === 2) { $("lt").classList.add("fade"); $("mark").classList.add("on"); }
    if (n === 3) { $("mark").classList.add("left"); $("word").classList.add("on"); }
    if (n === 4) { $("word").classList.add("up"); $("slogan").classList.add("on"); }
    if (n === 5) { $("tag").classList.add("on"); $("note").classList.add("on"); }
    if (n === 6) pages([2, 3]);
    if (n === 7) pages([5, 6]);
    if (n === 8) pages([7, 10]);
    // the label, the whole sticker and its description fit one frame; below it only the next section's label, which
    // the caption at the bottom may cover (a top caption would sit on the page heading during the move)
    if (n === 9) zoom(11, [0.0, 0.0, 1.0], [0.06, 0.15, 0.91]);
  };
</script>
</body>
</html>
